{% if show_time_divider %}
    <div class="chat-date-divider" data-divider-day="{{ message.created_at|date:'Y-m-d' }}">
        <span>{{ time_divider_label }}</span>
    </div>
{% endif %}
<article
    class="chat-message {% if is_own %}chat-message-own{% endif %} {% if not show_header %}chat-message-grouped{% endif %}"
    data-message-sender-id="{{ message.author_id }}"
    data-message-created-at="{{ message.created_at|date:'c' }}"
    data-message-day="{{ message.created_at|date:'Y-m-d' }}"
    data-message-author="{{ display_name }} {{ message.author.username }}"
    data-message-author-name="{{ display_name }}"
    data-search-text="{{ display_name }} {{ message.author.username }} {{ message.content|default:''|escape }}">
    {% if show_avatar %}
        <img
            src="{{ message.author.profile.image.url }}"
            alt="{{ message.author.username }} profile image"
            class="chat-message-avatar">
    {% else %}
        <div class="chat-message-avatar-spacer" aria-hidden="true"></div>
    {% endif %}

    <div class="chat-message-content">
        {% if show_header %}
            <div class="chat-message-meta">
                <span class="chat-message-author">
                    {{ display_name }}
                </span>
                <span class="discussion-meta-dot">•</span>
                <span class="post-timestamp" data-datetime="{{ message.created_at|date:'c' }}"></span>
            </div>
        {% endif %}

        {% if message.content %}
            <div class="chat-message-bubble">
                <p>{{ message.content }}</p>
            </div>
        {% endif %}

        {% if message.image %}
            <div class="chat-message-attachment">
                <button
                    type="button"
                    class="chat-message-image-btn"
                    data-chat-image="{{ message.image.url }}"
                    data-chat-image-alt="Announcement reply upload preview">
                    <img src="{{ message.image.url }}" alt="Announcement reply upload" class="chat-message-image">
                </button>
            </div>
        {% endif %}
    </div>
</article>
