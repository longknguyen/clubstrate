{% extends "base_role_admin.html" %}

{% block content %}
<div class="container">
    <h2>Select a CIO</h2>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>CIO Name</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        {% for cio in cios %}
        <tr>
            <td>{{ cio.name }}</td>
            <td>
                <a class="btn btn-sm btn-primary"
                   href="{% url 'cio_role_detail' cio.id %}">
                    Manage
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No CIOs found</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
