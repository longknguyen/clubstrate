{% extends "base.html" %}
{% load socialaccount %}
{% load static %}
p
{% block content %}
<div class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
    <h2>Create an Account</h2>
    <p>Sign up using your Google account.</p>

    <!-- Google register button -->
    <button class="gsi-material-button"
            onclick="window.location.href='{% provider_login_url 'google' process='signup' %}'">
        <div class="gsi-material-button-state"></div>
        <div class="gsi-material-button-content-wrapper">
            <div class="gsi-material-button-icon">
                <img src="{% static 'users/google_logo.png' %}" alt="Google logo" style="height:20px; width:20px;">
            </div>
            <span class="gsi-material-button-contents">Sign up with Google</span>
        </div>
    </button>

    <p style="margin-top:20px;">
        Already have an account? <a href="/users/login/">Log in</a>
    </p>
</div>
{% endblock %}
