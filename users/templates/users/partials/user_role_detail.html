<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

</body>
</html><h2>User Role Management: {{ target_user.username }}</h2>

<table>
    <thead>
    <tr>
        <th>CIO</th>
        <th>Current Role</th>
        <th>Change Role</th>
    </tr>
    </thead>

    <tbody>
    {% for membership in memberships %}
    <tr>
        <td>{{ membership.cio.name }}</td>

        <td>{{ membership.get_role_display }}</td>

        <td>
            <form method="POST" action="{% url 'change_role' membership.id %}">
                {% csrf_token %}

                <select name="role">
                    <option value="member" {% if membership.role == "member" %}selected{% endif %}>
                    Member
                    </option>

                    <option value="officer" {% if membership.role == "officer" %}selected{% endif %}>
                    Officer
                    </option>
                </select>

                <button type="submit">Update</button>
            </form>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No CIO memberships found.</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
