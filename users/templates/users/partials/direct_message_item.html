{% if show_time_divider %}
    <div class="chat-date-divider" data-divider-day="{{ message.created_at|date:'Y-m-d' }}">
        <span>{{ time_divider_label }}</span>
    </div>
{% endif %}
<article
    class="chat-message {% if is_own %}chat-message-own{% endif %}"
    data-message-sender-id="{{ message.sender_id }}"
    data-message-created-at="{{ message.created_at|date:'c' }}"
    data-message-day="{{ message.created_at|date:'Y-m-d' }}"
    data-search-text="{{ display_name }} {{ message.sender.username }} {{ message.content|default:''|escape }}">
    {% if show_avatar %}
        <img src="{{ message.sender.profile.image.url }}" alt="{{ message.sender.username }}" class="chat-message-avatar">
    {% else %}
        <div class="chat-message-avatar-spacer" aria-hidden="true"></div>
    {% endif %}
    <div class="chat-message-content">
        {% if show_header %}
            <div class="chat-message-meta">
                <span class="chat-message-author">{{ display_name }}</span>
                <span class="discussion-meta-dot">•</span>
                <span>{{ timestamp_label }}</span>
            </div>
        {% endif %}
        <div class="chat-message-bubble">
            <p>{{ message.content }}</p>
        </div>
    </div>
</article>
