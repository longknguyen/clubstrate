<!DOCTYPE html>
<html lang="en">
<head><title>Dashboard</title></head>
<body>
    <h1>Welcome, {{ request.user.username }}!</h1>

    {% if is_officer %}
        <h2>You are an Officer.</h2>
        <p>You have access to officer features.</p>
    {% else %}
        <h2>You are a Member.</h2>
        <p>You have access to member features.</p>
    {% endif %}
</body>
</html>
