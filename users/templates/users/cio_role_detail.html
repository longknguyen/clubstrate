{% extends "base_role_admin.html" %}

{% block content %}

<div class="container" style="margin-top: 30px;">

    <h2>{{ cio.name }} - Members</h2>

    <div class="card" style="margin-top: 20px;">
        <div class="card-body">

            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Change</th>
                </tr>
                </thead>

                <tbody>
                {% for membership in memberships %}
                <tr>
                    <td>{{ membership.user.username }}</td>
                    <td>{{ membership.get_role_display }}</td>

                    <td>
                        <form method="POST" action="{% url 'change_role' membership.id %}">
                            {% csrf_token %}

                            <select name="role" class="form-select form-select-sm" style="width: 140px; display: inline-block;">
                                <option value="member" {% if membership.role == "member" %}selected{% endif %}>
                                Member
                                </option>

                                <option value="officer" {% if membership.role == "officer" %}selected{% endif %}>
                                Officer
                                </option>
                            </select>

                            <button type="submit" class="btn btn-sm btn-outline-primary">
                                Update
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

{% endblock %}
