{% extends "base_role_admin.html" %}

{% block content %}

<div class="container" style="margin-top: 30px;">

    <h2>{{ cio.name }} - Members</h2>

    <div class="card overflow-hidden" style="border-radius: 24px;">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 custom-user-table">
                <thead>
                <tr>
                    <th style="padding-top: 30px; padding-bottom: 5px;">User</th>
                    <th style="padding-top: 30px; padding-bottom: 5px;">Role</th>
                    <th style="padding-top: 30px; padding-bottom: 5px;">Change</th>
                </tr>
                </thead>

                <tbody>
                {% for membership in memberships %}
                <tr>
                    <td>{{ membership.user.username }}</td>
                    <td>{{ membership.get_role_display }}</td>

                    <td>
                        <form method="POST" action="{% url 'change_role' membership.id %}" class="d-flex align-items-center gap-2">
                            {% csrf_token %}

                            <input type="hidden" name="redirect_type" value="cio">

                            <select name="role" class="custom-select-role">
                                <option value="viewer" {% if membership.role == "viewer" %}selected{% endif %}>
                                Viewer
                                </option>

                                <option value="member" {% if membership.role == "member" %}selected{% endif %}>
                                Member
                                </option>

                                <option value="officer" {% if membership.role == "officer" %}selected{% endif %}>
                                Officer
                                </option>
                            </select>

                            <button type="submit"
                                    class="nav-btn tooltip-bottom"
                                    data-tooltip="Update Role"
                                    style="border:none; background:none;">
                                <i data-lucide="square-check-big"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

{% endblock %}
