{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Search Users</h2>

    <form method="GET">
        <input type="text" name="q" placeholder="Search users..." value="{{ query }}">
        <button type="submit">Search</button>
    </form>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
                <a class="btn btn-sm btn-primary"
                   href="{% url 'user_role_detail' user.id %}">
                    Manage
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No users found</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
