{% extends "base_role_admin.html" %}

{% block content %}
<div class="container">
    <h2>Users</h2>

    <form method="GET" class="search-shell mb-3">
        <div class="search-input-shell" id="globalSearchInputShell">
            <input
                    type="text"
                    name="q"
                    value="{{ query }}"
                    placeholder="Search Users"
                    class="search-bar"
            >
        </div>
    </form>

    <div class="card overflow-hidden" style="border-radius: 24px;">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 custom-user-table">
                <thead style="border-top: none;">
                <tr>
                    <th style="padding-top: 30px; padding-bottom: 5px;">Username</th>
                    <th style="padding-top: 30px; padding-bottom: 5px;">Email</th>
                    <th class="text-end" style="width: 120px; padding-top: 30px; padding-bottom: 5px;"> Manage </th>
                </tr>
                </thead>

                <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td class="align-middle">
                        <div>
                            <a href="{% url 'user_detail' user.id %}"
                               class="nav-btn tooltip-bottom"
                               data-tooltip="Edit User">
                                <i data-lucide="user-pen"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">No users found</td>
                </tr>
                {% endfor %}
                </tbody>
            </table>

        </div>
    </div>
</div>
{% endblock %}
