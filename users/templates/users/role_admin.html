{% extends "base_role_admin.html" %}


{% block content %}
<div class="container" style="margin-top: 30px;">


    <h2>Role Management</h2>


    <ul class="nav nav-tabs" id="roleTabs" style="margin-bottom: 20px;">
        <li class="nav-item">
            <a class="nav-link active" id="tab-users" href="#" onclick="showUsers(event)">
                Users
            </a>
        </li>


        <li class="nav-item">
            <a class="nav-link" id="tab-cios" href="#" onclick="showCios(event)">
                CIOs
            </a>
        </li>
    </ul>


    <div id="users-section">


        <div class="card">
            <div class="card-body">


                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                    </thead>


                    <tbody>
                    {% for user in users %}
                    <tr>
                        <td>
                            <span class="role-admin-table-text role-admin-username" title="{{ user.username }}">{{ user.username }}</span>
                        </td>
                        <td>
                            <span class="role-admin-table-text" title="{{ user.email }}">{{ user.email }}</span>
                        </td>
                        <td>
                            <a href="{% url 'user_detail' user.id %}"
                               class="btn btn-sm btn-outline-primary">
                                Manage
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                    </tbody>
                </table>


            </div>
        </div>


    </div>


    <div id="cios-section" style="display:none;">


        <div class="card">
            <div class="card-body">


                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>CIO</th>
                        <th>Action</th>
                    </tr>
                    </thead>


                    <tbody>
                    {% for cio in cios %}
                    <tr>
                        <td>{{ cio.name }}</td>
                        <td>
                            <a href="{% url 'role_admin_cio_detail' cio.id %}"
                               class="btn btn-sm btn-outline-primary">
                                Manage
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                    </tbody>


                </table>


            </div>
        </div>


    </div>


</div>


<script>
    function showUsers(e) {
        if (e) e.preventDefault();


        // sections
        document.getElementById("users-section").style.display = "block";
        document.getElementById("cios-section").style.display = "none";


        // tabs
        document.getElementById("tab-users").classList.add("active");
        document.getElementById("tab-cios").classList.remove("active");
    }


    function showCios(e) {
        if (e) e.preventDefault();


        // sections
        document.getElementById("users-section").style.display = "none";
        document.getElementById("cios-section").style.display = "block";


        // tabs
        document.getElementById("tab-cios").classList.add("active");
        document.getElementById("tab-users").classList.remove("active");
    }
</script>


{% endblock %}
