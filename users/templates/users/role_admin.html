{% extends "base.html" %}

{% block content %}
<div class="container" style="margin-top: 40px;">

    <h1>User Role Management</h1>

    <form method="GET" style="margin-bottom: 20px; display:flex; gap:10px; align-items:center;">

        <input
                type="text"
                name="q"
                placeholder="Search username or email"
                value="{{ query|default:'' }}"
                class="form-control"
                style="max-width:300px;"
        >

        <select name="role" class="form-control" style="max-width:200px;">
            <option value="">All Roles</option>
            <option value="student" {% if role == "student" %}selected{% endif %}>Student</option>
            <option value="president" {% if role == "president" %}selected{% endif %}>CIO President</option>
        </select>

        <button type="submit" class="btn btn-primary">
            Search
        </button>

        <a href="{% url 'role-admin' %}" class="btn btn-secondary">
            Reset
        </a>

    </form>

    <table class="table table-bordered table-striped" style="margin-top: 20px;">
        <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Current Role</th>
            <th>Change Role</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        {% for profile in users %}
        <tr>
            <td>{{ profile.user.username }}</td>
            <td>{{ profile.user.email }}</td>
            <td>{{ profile.user_type }}</td>

            <td>
                <form method="POST" action="{% url 'update-role' profile.user.id %}">
                    {% csrf_token %}

                    <select name="user_type" class="form-control">
                        <option value="student"
                                {% if profile.user_type == "student" %}selected{% endif %}>
                        Student
                        </option>

                        <option value="president"
                                {% if profile.user_type == "president" %}selected{% endif %}>
                        CIO President
                        </option>
                    </select>
            </td>

            <td>
                <button type="submit" class="btn btn-primary btn-sm">
                    Update
                </button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
