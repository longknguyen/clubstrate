{% extends "base.html" %}

{% block content %}
<div class="content-section">
    <div class="media">
        <img class="rounded-circle account-img" src="{{ profile_image }}" alt="Profile Image">
        <div class="media-body">
            <h2 class="account-heading">{{ username }}</h2>
            <p class="text-secondary">{{ email }}</p>
            <p>{{ first_name }} {{ last_name }}</p>

            <form method="POST" action="{% url 'change-role' %}">
                {% csrf_token %}
                {% if role == 'officer' %}
                    <button class="btn btn-warning" type="submit">Switch to Member</button>
                {% else %}
                    <button class="btn btn-success" type="submit">Switch to Officer</button>
                {% endif %}
            </form>
        </div>
    </div>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger mt-3">Logout</button>
    </form>
</div>
{% endblock %}
