{% extends 'base.html' %}

{% block content %}
<h1>CIO Home Page</h1>
<p>Select a CIO below to view its page.</p>

{% if cios %}
    <ul>
        {% for cio in cios %}
            <li>
                <a href='{% url 'cio_detail' cio.id %}'>{{ cio.name }}</a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No CIOs have been created yet.</p>
{% endif %}

{% endblock %}
