{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIO Landing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            height: 100vh;
            background: #0f2027 linear-gradient(135deg, #0f2027, #2c5364, #00c6ff);
            color: white;
            overflow-x: hidden;
        }

        .nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1100px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 12px 20px;
            border-radius: 999px;

            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .logo img {
            height: 40px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-link-explore {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 10px;
            opacity: 0.85;
            transition: 0.3s;
        }

        .nav-link-explore:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            backdrop-filter: blur(5px);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .hero {
            position: absolute;
            top: 35%;
            left: 8%;
            max-width: 500px;
        }

        .hero h1 {
            font-size: 64px;
            line-height: 1.1;
            font-weight: 700;
        }

        .carousel-container {
            position: absolute;
            top: 20%;
            right: 8%;
            width: 800px;
        }

        .carousel {
            height: 480px;
            border-radius: 30px;
            overflow: hidden;

            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        .dot.active {
            background: white;
        }

        @media (max-width: 900px) {
            .hero {
                position: static;
                margin: 120px 20px 40px;
            }

            .carousel-container {
                position: static;
                margin: 0 auto;
                width: 90%;
            }

            .hero h1 {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">
        <img src="{% static 'users/logo.png' %}" alt="Logo">
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}" class="nav-link-explore">Explore</a>
        <button class="btn btn-primary" onclick="location.href='{% url 'register' %}'">Sign Up</button>
        <button class="btn btn-outline" onclick="location.href='{% url 'login' %}'">Log In</button>
    </div>
</div>

<div class="hero">
    <h1>Real connections happen here</h1>
</div>

<div class="carousel-container">
    <div class="carousel">
        <img id="carousel-image" src="{% static 'users/demo1.png' %}">
    </div>

    <div class="dots">
        <div class="dot active" onclick="setSlide(0)"></div>
        <div class="dot" onclick="setSlide(1)"></div>
        <div class="dot" onclick="setSlide(2)"></div>
    </div>
</div>

<script>
    const images = [
        "{% static 'users/demo1.png' %}",
        "{% static 'users/demo2.png' %}",
        "{% static 'users/demo3.png' %}"
    ];

    let currentIndex = 0;

    function setSlide(index) {
        currentIndex = index;
        updateCarousel();
    }

    function updateCarousel() {
        document.getElementById("carousel-image").src = images[currentIndex];

        document.querySelectorAll(".dot").forEach((dot, i) => {
            dot.classList.toggle("active", i === currentIndex);
        });
    }

    setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        updateCarousel();
    }, 4000);
</script>

</body>
</html>
