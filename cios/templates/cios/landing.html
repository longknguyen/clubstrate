{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIO Landing</title>
    <link rel="stylesheet" href="{% static 'cios/landing.css' %}">
</head>
<body>

<div class="nav">
    <div class="logo">
        <img src="{% static 'users/logo.png' %}" alt="Logo">
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}" class="nav-link-explore">Explore</a>
        <button class="btn btn-primary" onclick="location.href='{% url 'register' %}'">Sign Up</button>
        <button class="btn btn-outline" onclick="location.href='{% url 'login' %}'">Log In</button>
    </div>
</div>

<div class="hero">
    <h1>Real connections happen here</h1>
</div>

<div class="carousel-container">
    <div class="carousel">
        <img id="carousel-image" src="{% static 'users/demo1_update.png' %}">
    </div>

    <div class="dots">
        <div class="dot active" onclick="setSlide(0)"></div>
        <div class="dot" onclick="setSlide(1)"></div>
        <div class="dot" onclick="setSlide(2)"></div>
    </div>
</div>

<script>
    const images = [
        "{% static 'users/demo1_update.png' %}",
        "{% static 'users/demo2_update.png' %}",
        "{% static 'users/demo3_update.png' %}"
    ];

    let currentIndex = 0;

    function setSlide(index) {
        currentIndex = index;
        updateCarousel();
    }

    function updateCarousel() {
        document.getElementById("carousel-image").src = images[currentIndex];

        document.querySelectorAll(".dot").forEach((dot, i) => {
            dot.classList.toggle("active", i === currentIndex);
        });
    }

    setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        updateCarousel();
    }, 4000);
</script>

</body>
</html>
